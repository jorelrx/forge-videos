[project]
name = "forge-videos"
version = "0.1.0"
description = "CreatorBrain — gerador de roteiro de vídeo"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.4,<2",
    "langchain-anthropic>=1.4,<2",
    "langchain-openai>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sounddevice>=0.5.5",
    "numpy>=2.0",
    "soundfile>=0.13",
    "httpx>=0.27",
    "filelock>=3.13",
]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: exige os serviços externos no ar"]
addopts = ["-m", "not integration"]
