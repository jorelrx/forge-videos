[project]
name = "forge-videos"
version = "0.1.0"
description = "CreatorBrain — gerador de roteiro de vídeo"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langchain-core>=1.4,<2",
    "langchain-anthropic>=1.4,<2",
    "langchain-openai>=0.3",
    "ddgs>=9.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "sounddevice>=0.5.5",
]

[project.optional-dependencies]
# Camada de conhecimento. Stores externos (sobem via docker-compose);
# embeddings via sentence-transformers, modelo local.
knowledge = [
    "qdrant-client>=1.9",
    "neo4j>=5.19",
    "psycopg[binary]>=3.1",
    "sentence-transformers>=3.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]
# Parse de livros. OCR é separado por puxar binário de sistema (tesseract).
books = ["pypdf>=4.2", "ebooklib>=0.18", "beautifulsoup4>=4.12"]
ocr = ["pytesseract>=0.3.10", "pdf2image>=1.17"]

[project.scripts]
forge = "forge.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: exige os stores do docker-compose no ar"]
